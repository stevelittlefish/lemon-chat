# Live config for the lemon.com deployment. Committed: it holds no secrets.
# Secrets come from the environment via ${VAR} (the server's .env, gitignored).
# Data lives in $LEMON_DATA_DIR: ./data for local runs (./run.sh --config
# deploy/lemon.toml), /data in the Docker image.

[server]
port                     = 8069
debug                    = false
default_model            = "gemma4-31b"
dial_timeout_seconds     = 10
response_timeout_seconds = 600
max_tool_loops           = 10
timezone                 = "Europe/London"

# Bootstrap: runs once on first start when the DB has no users.
# Set LEMON_ADMIN_PASSWORD for a fresh install.
[bootstrap]
admin_username = "admin"

[searxng]
url = "http://lemon.com:8181"

[comfyui]
url             = "https://comfy.seaslug.ai"
default_profile = "general"

# Profiles are what the user wants, not which model makes it. Point them at
# whichever registered workflow (comfyui/workflows.toml) currently does that job
# best; several profiles may share a workflow. Descriptions are shown to the chat
# model, so they say when to pick the profile and how to write its prompt.

[comfyui.profile.general]
workflow    = "moss_image_int8"
description = "The default. Everyday scenes and anything that doesn't clearly fit another profile. Write a detailed description of the finished image in plain sentences: subject, setting, composition, lighting, colours."

[comfyui.profile.fast]
workflow    = "flux3_klein_distilled"
description = "Quick drafts, rough ideas and lots of variations, when speed matters more than polish (about 5 seconds)."

[comfyui.profile.photo]
workflow    = "krea2_turbo"
description = "Photorealistic images: portraits, products, places, street and documentary scenes. Describe it as a photograph: lens or shot type, lighting, depth of field, film or camera look."

[comfyui.profile.painting]
workflow    = "krea2_turbo"
description = "Paintings and traditional media: oil, watercolour, gouache, ink, charcoal, pencil. Name the medium and technique explicitly (e.g. thick impasto brushstrokes, wet-on-wet washes, visible paper texture)."

[comfyui.profile.illustration]
workflow    = "krea2_turbo"
description = "Drawn, non-anime illustration: graphic novel, comic, picture book, poster art, editorial, flat or vector styles. Name the drawn style explicitly (e.g. clean ink outlines, flat colour, halftone shading); without it the result tends to look rendered or photographic."

[comfyui.profile.anime]
workflow    = "anima_aesthetic_1_1"
description = "Anime and manga style. Describe the characters (hair, eyes, clothing, expression, pose) and the scene."

[comfyui.profile.text]
workflow    = "moss_image_int8"
description = "Images where readable words matter: posters, signs, menus, labels, covers. Put every piece of text in double quotes exactly as it should appear, and say where it goes and how it looks."

[[model_server]]
name     = "lemon"
api_base = "http://ai.lemon.com:8008/v1"

[[model_server]]
name     = "ollama"
api_base = "http://ai.lemon.com:11434/v1"

# Restricted servers cost money: only admins and users granted "Restricted
# models" on the admin users page can use them.
[[model_server]]
name       = "openrouter"
api_base   = "https://openrouter.ai/api/v1"
api_key    = "${OPENROUTER_API_KEY}"
restricted = true

# OpenAI via ChatGPT/Codex account login (Responses API, shared OAuth token).
# Connect the account with `lemon-chat --openai-login` or Settings → Tools.
[[model_server]]
name     = "codex"
api_base = "https://chatgpt.com/backend-api/codex"
api      = "responses"
auth     = "oauth"

# Models: name is the stable name stored by characters, conversations and
# research; id is what the provider is sent. To upgrade a model, edit its id
# (and display_name if it carries a version) and leave name alone.

# --- Codex (ChatGPT subscription: usage limits, no per-token cost)

[[model]]
name         = "gpt-sol"
id           = "gpt-6.1-sol"
display_name = "GPT Sol"
model_server = "codex"
vision       = true
modes        = ["chat"]

[[model]]
name         = "gpt-terra"
id           = "gpt-6.1-terra"
display_name = "GPT Terra"
model_server = "codex"
vision       = true
modes        = ["chat"]

[[model]]
