# ComfyUI workflow registry for the generate_image tool.
#
# Each [[workflow]] is a ComfyUI API-format export in comfyui/workflows/ (paths
# are relative to this file). The tool never edits a file by guessing: every
# input it changes is named here as "node_id.input_name", and every binding is
# checked against the graph at startup. A workflow that fails the check is
# logged and reported as unavailable instead of being used.
#
#   id              exact name the model can pass as workflow_id (if exposed)
#   file            workflow JSON, relative to this file
#   description     shown to the model for exposed workflows
#   exposed         list this workflow in the tool's workflow_id enum
#   timeout         seconds to wait for the image (default 120)
#   prompt          string input containing %PROMPT% exactly once; any text
#                   around it (e.g. Pony's score tags) is kept
#   negative_prompt optional string input; its value in the file is the default
#                   negative, which the model may replace. Omit it for graphs
#                   where a negative has no effect (cfg 1, ConditioningZeroOut,
#                   BasicGuider)
#   seed            integer input(s) that receive the seed
#   width, height   integer input(s) that receive the dimensions
#   output          node whose images are returned
#   sizes           [width, height] per aspect ratio: square, landscape, portrait
#
# Timeouts come from warm-model timings in ComfyTestBed (roughly 4× the
# slowest warm run, minimum 120s) to allow for a cold model load.
#
# Profiles (fast, general, ...) are mapped to these IDs in lemon.toml.

# --- lemon-chat's original workflows (previously generate_image_sdxl / _flux) ---

[[workflow]]
id              = "lemon_sdxl"
file            = "workflows/lemon_sdxl.json"
description     = "Classic Stable Diffusion XL base, 30 steps, CFG 7, karras scheduler. Works best with shorter, keyword-style prompts."
exposed         = true
prompt          = "2.text"
negative_prompt = "3.text"
seed            = ["5.seed"]
width           = ["4.width"]
height          = ["4.height"]
output          = "7"
sizes           = { square = [1024, 1024], landscape = [1216, 832], portrait = [832, 1216] }

[[workflow]]
id              = "lemon_flux_schnell"
file            = "workflows/lemon_flux_schnell.json"
description     = "Flux Schnell, 4 steps. Fast; ignores negative prompts."
prompt          = "6.text"
seed            = ["3.seed"]
width           = ["5.width"]
height          = ["5.height"]
output          = "9"
sizes           = { square = [1024, 1024], landscape = [1216, 832], portrait = [832, 1216] }

