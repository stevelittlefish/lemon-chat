# The ComfyTestBed export runs the prompt through an in-graph LLM rewriter
# (TextGenerate + switch). This copy removes it and encodes the prompt directly;
# ComfyTestBed's MOSS renders and timings were made WITH the rewriter.
# MOSS was trained on captions describing finished images: 80-200 words of plain
# prose, medium and subject first, visible text quoted exactly, no quality tags.
[[workflow]]
id              = "moss_image_int8"
file            = "workflows/moss_image_int8.json"
description     = "MOSS-Image (int8), 25 steps, CFG 2.5. Wants a detailed prose caption of the finished image (medium and subject first, exact quoted text, no quality tags)."
exposed         = true
prompt          = "18:4.text"
negative_prompt = "18:5.text"
seed            = ["18:7.seed"]
width           = ["18:6.width"]
height          = ["18:6.height"]
output          = "9"
sizes           = { square = [1024, 1024], landscape = [1216, 832], portrait = [832, 1216] }

