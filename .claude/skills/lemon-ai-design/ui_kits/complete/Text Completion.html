<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>lemon ai — text completion (layout options)</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="../../components.css">
  <link rel="icon" href="../../assets/logo-mark.svg">
  <style>
    html, body { height: 100%; margin: 0; }
    .ab-frame { width: 100%; height: 100%; border: none; display: block; background: var(--bg); }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel">
    const { useState } = React;

    function Frame({ layout }) {
      // Remount the iframe on demand so a fresh state is easy to get.
      const [k, setK] = useState(0);
      return (
        <iframe
          key={k}
          className="ab-frame"
          src={"app.html?layout=" + layout}
          title={"Complete — " + layout}
        />
      );
    }

    function Canvas() {
      return (
        <DesignCanvas>
          <DCSection
            id="complete-layouts"
            title="Text Completion"
            subtitle="Same surface, two places for the generation parameters. Both are live — type, switch Write/Read, and press Run (⌘↵)."
          >
            <DCArtboard id="rail" label="A · Parameters in a right rail" width={1240} height={820}>
              <Frame layout="rail" />
            </DCArtboard>
            <DCArtboard id="bar" label="B · Parameters in a bottom bar" width={1240} height={820}>
              <Frame layout="bar" />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Canvas />);
  </script>
</body>
</html>
