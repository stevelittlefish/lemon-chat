<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 22px 32px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .cell .swatch { width: 100%; height: 56px; }
  .cell { display: flex; flex-direction: column; gap: 5px; }
  .cell .lbl { font-size:11px; }
  .cell .sub { font-size:10px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="swatch" style="background:#1B1814"></div><div class="lbl">ink 900</div><div class="sub">#1B1814</div></div>
    <div class="cell"><div class="swatch" style="background:#3A332A"></div><div class="lbl">ink 700</div><div class="sub">#3A332A</div></div>
    <div class="cell"><div class="swatch" style="background:#6B6357"></div><div class="lbl">ink 500</div><div class="sub">#6B6357</div></div>
    <div class="cell"><div class="swatch" style="background:#8E8576"></div><div class="lbl">ink 400</div><div class="sub">#8E8576</div></div>
    <div class="cell"><div class="swatch" style="background:#B5AB97"></div><div class="lbl">ink 300</div><div class="sub">#B5AB97</div></div>
    <div class="cell"><div class="swatch" style="background:#D6CDB7"></div><div class="lbl">ink 200</div><div class="sub">#D6CDB7</div></div>
    <div class="cell"><div class="swatch" style="background:#E7DFC9"></div><div class="lbl">ink 100</div><div class="sub">#E7DFC9</div></div>
  </div>
</body></html>
