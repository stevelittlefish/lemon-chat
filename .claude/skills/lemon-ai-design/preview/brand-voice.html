<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 22px 28px; display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; align-items:center; gap:18px; }
  .lab { font-family: var(--font-mono); font-size:10px; color: var(--fg-faint); text-transform: uppercase; letter-spacing: 0.08em; width: 80px; }
  .ok, .no { font-size: 14px; padding: 10px 14px; border-radius: 8px; }
  .ok { background: var(--leaf-100); color: var(--leaf-700); border: 1px solid #C2D1A4; }
  .no { background: var(--brick-100); color: var(--brick-700); border: 1px solid #E8C3B3; text-decoration: line-through; }
</style>
</head>
<body>
  <div class="row">
    <span class="lab">say this</span>
    <div class="ok">Pick a model. We'll download it in the background.</div>
  </div>
  <div class="row">
    <span class="lab">not that</span>
    <div class="no">🚀 Seamlessly onboard your AI experience</div>
  </div>
  <div class="row">
    <span class="lab">errors</span>
    <div class="ok">Couldn't reach the model. Is the server running?</div>
  </div>
</body></html>
