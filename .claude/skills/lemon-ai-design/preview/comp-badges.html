<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 28px 32px; display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .lab { font-family:var(--font-mono); font-size:10px; color:var(--fg-faint); width:60px; }
</style>
</head>
<body>
  <div class="row">
    <span class="lab">badges</span>
    <span class="badge live"><span class="dot"></span> running locally</span>
    <span class="badge"><span class="dot"></span> idle</span>
    <span class="badge accent"><span class="dot"></span> new</span>
    <span class="badge warn"><span class="dot"></span> needs update</span>
  </div>
  <div class="row">
    <span class="lab">chips</span>
    <span class="chip">llama-3.1-8b</span>
    <span class="chip">Q4_K_M · 4.9 GB</span>
    <span class="chip">temperature 0.7</span>
    <span class="chip">36 tok/s</span>
  </div>
