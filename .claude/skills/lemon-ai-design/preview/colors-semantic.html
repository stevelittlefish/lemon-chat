<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 22px 32px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .group { display:flex; flex-direction:column; gap:8px; }
  .pair { display:flex; gap:10px; }
  .sw { width: 48px; height: 48px; border-radius: var(--radius-md); border:1px solid var(--border); }
  .info .lbl { font-size:12px; font-weight:600; }
  .info .sub { font-size:11px; color: var(--fg-muted); font-family: var(--font-mono); }
  .info .use { font-size:11px; color: var(--fg-muted); margin-top:2px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="group">
      <div class="pair">
        <div class="sw" style="background:#E2EBCC"></div>
        <div class="sw" style="background:#5C7A3E"></div>
      </div>
      <div class="info">
        <div class="lbl">leaf · success</div>
        <div class="sub">#5C7A3E / #E2EBCC</div>
        <div class="use">"running locally" dot, models downloaded</div>
      </div>
    </div>
    <div class="group">
      <div class="pair">
        <div class="sw" style="background:#F3D9CC"></div>
        <div class="sw" style="background:#B3361B"></div>
      </div>
      <div class="info">
        <div class="lbl">brick · danger</div>
        <div class="sub">#B3361B / #F3D9CC</div>
        <div class="use">errors, destructive actions (delete chat)</div>
      </div>
    </div>
    <div class="group">
      <div class="pair">
        <div class="sw" style="background:#DCE6F4"></div>
        <div class="sw" style="background:#3565A8"></div>
      </div>
      <div class="info">
        <div class="lbl">sky · link</div>
        <div class="sub">#3565A8</div>
        <div class="use">inline links in body copy, sparingly</div>
      </div>
    </div>
  </div>
</body></html>
