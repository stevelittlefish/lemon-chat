<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 26px 32px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  pre.code {
    background: var(--bg-inset);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    margin: 0;
    font-size: 13px;
    color: var(--ink-700);
    overflow: hidden;
  }
  .ey { display: flex; gap: 14px; align-items: center; }
</style>
</head>
<body>
  <div class="stack">
    <div class="ey">
      <span class="eyebrow">EYEBROW · MONO CAPS</span>
      <span class="tag">12 / +0.08em</span>
    </div>
    <pre class="code">llama-3.1-8b-instruct · Q4_K_M · 4.9 GB
  └─ running on Apple M2 · 36 tokens/sec</pre>
    <div class="row" style="gap:10px;">
      <kbd style="font-family:var(--font-mono);background:var(--bg-inset);border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:2px 8px;font-size:12px;">⌘ K</kbd>
      <span class="body-sm">opens the command bar</span>
    </div>
  </div>
</body></html>
