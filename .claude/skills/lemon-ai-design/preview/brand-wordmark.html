<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 22px 28px; display:flex; gap:22px; align-items:center; }
  .pane { flex:1; display:flex; flex-direction:column; gap:8px; }
  .frame {
    height: 130px;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    background: var(--paper-0);
    display:flex; align-items:center; justify-content:center;
    padding: 12px;
  }
  .dark { background: var(--ink-900); }
  .cap { font-size:11px; color:var(--fg-faint); font-family:var(--font-mono); }
</style>
</head>
<body>
  <div class="pane">
    <div class="frame"><img src="../assets/logo-wordmark.svg" alt="" style="height:46px;"></div>
    <div class="cap">wordmark · light</div>
  </div>
  <div class="pane">
    <div class="frame dark">
      <img src="../assets/logo-wordmark.svg" alt="" style="height:46px;filter:invert(1) hue-rotate(180deg) saturate(1.2);">
    </div>
    <div class="cap">wordmark · dark · inverted</div>
  </div>
</body></html>
