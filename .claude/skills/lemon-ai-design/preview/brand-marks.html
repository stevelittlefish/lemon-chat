<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 18px 28px; display:flex; gap:16px; align-items:center; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .frame {
    width: 110px; height: 110px;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    background: var(--paper-0);
    display:flex; align-items:center; justify-content:center;
  }
  .cap { font-size:10px; color:var(--fg-faint); font-family:var(--font-mono); }
  .name { font-size:11px; color:var(--fg-strong); font-weight:500; }
</style>
</head>
<body>
  <div class="item"><div class="frame"><img src="../assets/logo-mark.svg" width="64"></div><div class="name">logo-mark</div><div class="cap">≥ 24px</div></div>
  <div class="item"><div class="frame"><img src="../assets/lemon-slice.svg" width="72"></div><div class="name">lemon-slice</div><div class="cap">empty states</div></div>
  <div class="item"><div class="frame"><img src="../assets/sparkle.svg" width="56" style="color:var(--ink-900);"></div><div class="name">sparkle</div><div class="cap">model picker</div></div>
  <div class="item">
    <div class="frame" style="background:var(--paper-50);">
      <span style="font-family:var(--font-display);font-size:24px;font-weight:600;">word
        <span class="scribble">here</span>
      </span>
    </div>
    <div class="name">.scribble</div>
    <div class="cap">emphasis underline</div>
  </div>
</body></html>
