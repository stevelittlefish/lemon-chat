<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 24px 32px; }
  .row { display:flex; align-items:center; gap:18px; margin-bottom:10px; }
  .label { width: 130px; font-family: var(--font-mono); font-size:11px; color: var(--fg-muted); }
  .track { flex:1; height: 6px; background: var(--paper-100); border-radius: 999px; position:relative; overflow:hidden; }
  .dot { width: 14px; height: 14px; background: var(--lemon-500); border:1.5px solid var(--ink-900); border-radius: 50%; position:absolute; top:50%; transform: translateY(-50%); }
  .dur { width: 70px; font-family: var(--font-mono); font-size:11px; color: var(--fg-strong); text-align:right; }
  .name { font-size:12px; color: var(--fg-strong); font-weight:500; width: 100px; }
  @keyframes glide1 { 0%{left:0;} 100%{left:calc(100% - 14px);} }
  @keyframes glide2 { 0%{left:0;} 100%{left:calc(100% - 14px);} }
  @keyframes glide3 { 0%{left:0;} 100%{left:calc(100% - 14px);} }
  .d1 { animation: glide1 1.8s var(--ease) infinite alternate; }
  .d2 { animation: glide2 1.8s var(--ease-out) infinite alternate; }
  .d3 { animation: glide3 1.8s linear infinite alternate; }
</style>
</head>
<body>
  <div class="row">
    <span class="name">default</span>
    <span class="label">ease</span>
    <div class="track"><div class="dot d1"></div></div>
    <span class="dur">200 ms</span>
  </div>
  <div class="row">
    <span class="name">entrance</span>
    <span class="label">ease-out</span>
    <div class="track"><div class="dot d2"></div></div>
    <span class="dur">320 ms</span>
  </div>
  <div class="row">
    <span class="name">micro</span>
    <span class="label">linear</span>
    <div class="track"><div class="dot d3"></div></div>
    <span class="dur">120 ms</span>
  </div>
</body></html>
