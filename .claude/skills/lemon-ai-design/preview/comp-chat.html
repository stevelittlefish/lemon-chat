<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 24px 32px; display:flex; flex-direction:column; gap:12px; }
  .thread { display:flex; flex-direction:column; gap:14px; max-width: 640px; }
  .typing-dots { display:inline-flex; gap:4px; padding-top:4px; }
  .typing-dots span { width:6px; height:6px; border-radius:50%; background: var(--ink-400); animation: blink 1.4s infinite var(--ease); }
  .typing-dots span:nth-child(2){ animation-delay: 0.2s; }
  .typing-dots span:nth-child(3){ animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity: 0.3; } 40% { opacity: 1; } }
</style>
</head>
<body>
  <div class="thread">
    <div class="bubble-user">What's a lemon?</div>
    <div class="bubble-ai">
      A lemon is a yellow citrus fruit. Tart, used for flavoring food and drinks, and a surprisingly common metaphor for a faulty product.
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>
  </div>
</body></html>
