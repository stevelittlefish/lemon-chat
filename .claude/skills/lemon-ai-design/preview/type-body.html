<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 28px 36px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row-line { display: flex; align-items: baseline; gap: 18px; }
  .row-line .tag { min-width: 88px; flex-shrink: 0; font-size: 10px; }
</style>
</head>
<body>
  <div class="stack">
    <div class="row-line">
      <span class="tag">body-lg / 18</span>
      <span class="body-lg">A chat client for AI that runs on your own machine.</span>
    </div>
    <div class="row-line">
      <span class="tag">body / 16</span>
      <span class="body">Conversations live on your computer. We never see them, and there's no account to make.</span>
    </div>
    <div class="row-line">
      <span class="tag">body-sm / 14</span>
      <span class="body-sm">8 conversations · last used 2 minutes ago</span>
    </div>
    <div class="row-line">
      <span class="tag">caption / 12</span>
      <span class="caption">Press Enter to send · Shift + Enter for newline</span>
    </div>
  </div>
</body></html>
