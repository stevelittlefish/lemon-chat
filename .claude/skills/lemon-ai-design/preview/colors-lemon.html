<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 22px 32px; display:flex; flex-direction:column; gap:14px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .cell .swatch { width: 100%; height: 56px; }
  .cell { display: flex; flex-direction: column; gap: 5px; }
  .cell .lbl { font-size:11px; }
  .cell .sub { font-size:10px; }
  .note { font-size:12px; color: var(--fg-muted); display:flex; gap:8px; align-items:center; }
  .note::before { content:""; width:8px; height:8px; border-radius:50%; background: var(--lemon-500); box-shadow: 0 0 0 1px var(--ink-200); }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="swatch" style="background:#FFF8D6"></div><div class="lbl">lemon 50</div><div class="sub">#FFF8D6</div></div>
    <div class="cell"><div class="swatch" style="background:#FCEC9A"></div><div class="lbl">lemon 100</div><div class="sub">#FCEC9A</div></div>
    <div class="cell"><div class="swatch" style="background:#F7D84A"></div><div class="lbl">lemon 300</div><div class="sub">#F7D84A</div></div>
    <div class="cell"><div class="swatch" style="background:#F5C518"></div><div class="lbl">lemon 500 ★</div><div class="sub">#F5C518</div></div>
    <div class="cell"><div class="swatch" style="background:#C8951A"></div><div class="lbl">lemon 700</div><div class="sub">#C8951A</div></div>
    <div class="cell"><div class="swatch" style="background:#6E5210"></div><div class="lbl">lemon 900</div><div class="sub">#6E5210</div></div>
  </div>
  <div class="note">One lemon element per viewport. The whole system rests on this rule.</div>
</body></html>
