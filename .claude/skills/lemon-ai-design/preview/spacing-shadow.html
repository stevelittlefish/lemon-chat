<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 28px 32px; display:flex; gap:28px; align-items:center; }
  .item { display:flex; flex-direction:column; gap:10px; align-items:center; }
  .box { width: 80px; height: 60px; background: var(--paper-0); border-radius: 12px; border: 1px solid var(--border-soft); }
  .lbl { font-size: 11px; color: var(--fg-strong); font-weight:500; }
  .sub { font-size: 10px; color: var(--fg-muted); font-family: var(--font-mono); max-width: 120px; text-align:center; }
</style>
</head>
<body>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-xs);"></div><div class="lbl">xs · hairline</div></div>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-sm);"></div><div class="lbl">sm · resting card</div></div>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-md);"></div><div class="lbl">md · hover lift</div></div>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-lg);"></div><div class="lbl">lg · dialog</div></div>
  <div class="item"><div class="box" style="box-shadow: var(--shadow-inset); background: var(--bg-inset);"></div><div class="lbl">inset · pressed</div></div>
</body></html>
