<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 22px 28px; display:grid; grid-template-columns: 1fr 1fr; gap:18px; }
  .card .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .card h4 { margin:0; font-size:15px; font-weight:600; }
  .card p { margin:0; font-size:13px; color: var(--fg-muted); line-height:1.5; }
  .meta { font-family:var(--font-mono); font-size:11px; color: var(--fg-faint); }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <h4>llama-3.1-8b-instruct</h4>
      <span class="badge live"><span class="dot"></span> running</span>
    </div>
    <p>Solid all-rounder. Fast on most laptops.</p>
    <div class="meta" style="margin-top:8px;">Q4_K_M · 4.9 GB · 36 tok/s</div>
  </div>
  <div class="card card-interactive">
    <div class="head">
      <h4>qwen2.5-coder-7b</h4>
      <span class="badge"><span class="dot"></span> downloaded</span>
    </div>
    <p>Best for code. Reads diffs cleanly.</p>
    <div class="meta" style="margin-top:8px;">Q5_K_M · 5.4 GB · idle</div>
  </div>
</body></html>
