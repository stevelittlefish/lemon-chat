<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 26px 32px; display:flex; gap:22px; align-items:center; }
  .item { display:flex; flex-direction:column; gap:8px; align-items:center; }
  .box { width: 80px; height: 80px; background: var(--paper-0); border:1px solid var(--ink-900); }
  .lbl { font-size: 11px; color: var(--fg-strong); font-weight:500; }
  .sub { font-size: 11px; color: var(--fg-muted); font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:2px;"></div><div class="lbl">xs</div><div class="sub">2px</div></div>
  <div class="item"><div class="box" style="border-radius:4px;"></div><div class="lbl">sm · buttons</div><div class="sub">4px</div></div>
  <div class="item"><div class="box" style="border-radius:6px;"></div><div class="lbl">md · inputs</div><div class="sub">6px</div></div>
  <div class="item"><div class="box" style="border-radius:8px;"></div><div class="lbl">lg · cards</div><div class="sub">8px</div></div>
  <div class="item"><div class="box" style="border-radius:12px;"></div><div class="lbl">xl · dialogs</div><div class="sub">12px</div></div>
  <div class="item"><div class="box" style="border-radius:999px;"></div><div class="lbl">pill</div><div class="sub">999px</div></div>
</body></html>
