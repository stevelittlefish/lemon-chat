<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 18px 24px; display:flex; gap:18px; align-items:center; justify-content:center; }
  .composer {
    width: 100%; max-width: 580px;
    background: var(--paper-0);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
    padding: 10px 12px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }
  .composer textarea {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    resize: none;
    color: var(--ink-900);
    min-height: 24px;
    padding: 6px 4px;
  }
  .composer textarea::placeholder { color: var(--fg-placeholder); }
  .composer-actions { display:flex; gap:6px; align-items:center; }
  .send {
    width: 32px; height: 32px;
    border-radius: 999px;
    background: var(--lemon-500);
    border: 1px solid var(--lemon-700);
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
  }
  .chip-attach {
    font-size:11px; color:var(--fg-muted);
    font-family: var(--font-mono);
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px dashed var(--border);
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="composer">
    <textarea rows="1" placeholder="Ask anything…">summarize the article I just pasted</textarea>
    <div class="composer-actions">
      <span class="chip-attach">+ attach</span>
      <button class="send" aria-label="Send">
        <polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</body></html>
