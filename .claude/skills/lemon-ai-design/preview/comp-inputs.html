<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 24px 32px; display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:12px; align-items:center; }
  .lab { font-size:12px; color:var(--fg-muted); width:100px; }
  .field { flex:1; max-width: 260px; }
</style>
</head>
<body>
  <div class="row">
    <span class="lab">default</span>
    <div class="field"><input class="input" placeholder="Ask anything…"></div>
    <div class="field"><input class="input" value="llama-3.1-8b" style="font-family:var(--font-mono);"></div>
  </div>
  <div class="row">
    <span class="lab">focused</span>
    <div class="field"><input class="input" value="What's a lemon?" style="border-color:var(--lemon-500); box-shadow: var(--ring-accent);"></div>
    <div class="field"><input class="input" placeholder="disabled" disabled></div>
  </div>
  <div class="row">
    <span class="lab">textarea</span>
    <div class="field" style="max-width:520px; flex:1;"><textarea class="input textarea" placeholder="Type a message…">Hey — can you summarize this paper?</textarea></div>
  </div>
</body></html>
