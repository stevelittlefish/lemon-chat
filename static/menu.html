<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lemon chat</title>
  <link rel="icon" href="/assets/favicon.ico">
  <link rel="stylesheet" href="/css/colors_and_type.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/menu.css">
</head>
<body>
  <div class="menu-screen">
    <div class="menu-brand">
      <img src="/assets/logo-mark.svg" alt="lemon chat" class="menu-logo">
      <h1 class="menu-brand-name">lemon chat</h1>
    </div>
    <p class="menu-eyebrow">choose a mode</p>
    <div class="menu-cards">
      <a href="/" class="menu-card">
        <div class="menu-card-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="menu-card-name">chat</div>
        <p class="menu-card-desc">conversations with AI models</p>
      </a>
      <a href="/complete" class="menu-card">
        <div class="menu-card-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="21" y1="6" x2="3" y2="6"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
            <line x1="17" y1="18" x2="3" y2="18"/>
          </svg>
        </div>
        <div class="menu-card-name">complete</div>
        <p class="menu-card-desc">freeform text completions</p>
      </a>
      <a href="/research" class="menu-card">
        <div class="menu-card-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
        </div>
        <div class="menu-card-name">research</div>
        <p class="menu-card-desc">in-depth web research reports</p>
      </a>
    </div>
  </div>
</body>
</html>
