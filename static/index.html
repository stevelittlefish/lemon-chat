<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lemon chat</title>
  <link rel="icon" href="/assets/favicon.ico">
  <link rel="stylesheet" href="/css/colors_and_type.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/katex.min.css">
</head>
<body>

<!-- Login screen -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="login-brand">
      <img src="/assets/logo-mark.svg" alt="lemon chat" class="login-logo">
      <h1 class="login-brand-name">lemon chat</h1>
    </div>
    <form id="login-form" class="login-form">
      <div class="field-group">
        <label class="body-sm" for="username">username</label>
        <input id="username" name="username" type="text" class="input" autocomplete="username" required>
      </div>
      <div class="field-group">
        <label class="body-sm" for="password">password <span class="fg-muted">(optional)</span></label>
        <input id="password" name="password" type="password" class="input" autocomplete="current-password">
      </div>
      <div id="login-error" class="login-error hidden"></div>
      <button type="submit" class="btn btn-primary">sign in</button>
    </form>
  </div>
</div>

<!-- App shell -->
<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar"></aside>
  <main id="main" class="main">
    <div id="chat-header" class="chat-header"></div>
    <div id="thread-container" class="thread-container">
      <div id="thread" class="thread"></div>
    </div>
    <div id="composer-container" class="composer-container"></div>
  </main>
  <aside id="artifact-panel" class="artifact-panel" hidden>
    <div class="artifact-panel-header">
      <div class="artifact-panel-title-wrap">
        <span id="artifact-panel-title" class="artifact-panel-title"></span>
        <span id="artifact-panel-filename" class="artifact-panel-filename"></span>
      </div>
      <div class="artifact-panel-actions">
        <a id="artifact-panel-download" class="btn btn-secondary btn-sm" download>Download</a>
        <button id="artifact-panel-close" class="artifact-panel-x" aria-label="Close artifact panel"></button>
      </div>
    </div>
    <div id="artifact-panel-body" class="artifact-panel-body"></div>
  </aside>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
